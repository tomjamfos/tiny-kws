[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "tiny-kws"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "onnx>=1.16",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "tiny-kws[train]",
    "pybind11>=2.13",
    "pytest>=8.0",
    "ruff>=0.6",
    "soundfile>=0.14.0",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "matplotlib>=3.9",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["tiny_kws"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/**" },
    { file = "bindings/**" },
]

[tool.pyright]
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
